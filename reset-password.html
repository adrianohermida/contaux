<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefinir Senha | Contaux Contadoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Spartan:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/modals.css" />
    <style>
        body {
            font-family: 'Spartan', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
        }
        .reset-card img { width: 44px; display: block; margin: 0 auto 16px; }
        .reset-card h3 { text-align: center; font-size: 22px; font-weight: 700; color: #1a1a2e; margin: 0 0 8px; }
        .reset-card .subtitle { text-align: center; font-size: 14px; color: #6b7280; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="reset-card">
        <img src="assets/images/contaux_blue.png" alt="Contaux">
        <h3>Redefinir Senha</h3>
        <p class="subtitle">Digite sua nova senha</p>
        <form id="ctx-reset-page-form">
            <div class="ctx-alert"></div>
            <div class="ctx-field">
                <label>Nova senha</label>
                <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="ctx-field">
                <label>Confirmar senha</label>
                <input type="password" name="password_confirm" required minlength="6" placeholder="Repita a nova senha">
            </div>
            <button type="submit" class="ctx-btn ctx-btn-primary">Redefinir senha</button>
        </form>
        <p style="text-align:center;margin-top:20px;"><a href="/" style="color:#3763EB;font-size:13px;font-weight:600;text-decoration:none;">← Voltar para o site</a></p>
    </div>
    <script src="assets/js/site-modals.js"></script>
</body>
</html>
