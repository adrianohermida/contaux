# nginx produção — Contaux (contaux.com.br + www.contaux.com.br)
# Serve site estático + dashboard SPA compilado + proxy para API
#
# MODO 1 — Behind Cloudflare proxy (recomendado, SSL na edge da Cloudflare):
#   Use apenas o bloco HTTP (porta 80). Cloudflare fornece HTTPS.
#
# MODO 2 — SSL direto com Let's Encrypt:
#   1. Rode com apenas o bloco HTTP ativo
#   2. docker compose -f docker-compose.prod.yml run --rm certbot
#   3. Descomente o bloco HTTPS e o return 301 no bloco HTTP
#   4. docker compose -f docker-compose.prod.yml restart web

# ============================================================
# HTTP — sempre ativo
# ============================================================
server {
    listen 80;
    server_name contaux.com.br www.contaux.com.br;

    # Verificação Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona www → não-www
    if ($host = 'www.contaux.com.br') {
        return 301 http://contaux.com.br$request_uri;
    }

    # --- MODO 2 (SSL direto): descomente a linha abaixo para forçar HTTPS ---
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/prod-routes.conf;
}

