server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /inicio serves the home page (PT-BR friendly route)
    location = /inicio {
        try_files /index.html =404;
    }

    # Vite dev server: modules, HMR client, deps — regex beats prefix locations
    location ~ ^/(src|@vite|node_modules)/ {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # App dashboard routes — proxy to Vite SPA
    location /dashboard {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /crm {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /financeiro {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /contabilidade {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /suporte {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /marketing {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /admin {
        proxy_pass http://dashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Static site: pretty URLs + fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static site assets (only if file exists)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
