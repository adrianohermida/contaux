# Rotas compartilhadas entre HTTP e HTTPS (produção)
# Incluído por nginx/prod.conf

# Dashboard SPA — assets compilados (precede o regex de rotas)
location ^~ /dashboard/assets/ {
    alias /usr/share/nginx/dashboard/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Dashboard SPA — todas as rotas do app retornam index.html
location ~ ^/(dashboard|inbox|crm|financeiro|contabilidade|suporte|marketing|admin)(/|$) {
    try_files /dashboard$uri /dashboard/index.html =404;
}

# API backend — proxy para Express
location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# /inicio serve a home (rota amigável PT-BR)
location = /inicio {
    try_files /index.html =404;
}

# Site estático — pretty URLs + fallback
location / {
    try_files $uri $uri/ $uri.html /index.html;
}

# Cache de assets estáticos do site
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
